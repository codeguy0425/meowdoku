<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowdoku Solver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Meow<span>doku</span> Solver</h1>
  <div class="toolbar">
    <label>Rows</label>
    <input type="number" id="gridRows" value="6" min="3" max="20">
    <label>Cols</label>
    <input type="number" id="gridCols" value="6" min="3" max="20">
    <button onclick="Editor.resize()">Resize</button>
  </div>
  <div class="toolbar mode-btns" id="editModeBtns">
    <button class="active" data-mode="region" onclick="Editor.setMode('region')">Region</button>
    <button data-mode="cat" onclick="Editor.setMode('cat')">Cat</button>
    <button data-mode="x" onclick="Editor.setMode('x')">X</button>
    <button data-mode="erase" onclick="Editor.setMode('erase')">Erase</button>
  </div>
  <div class="region-palette" id="regionPalette"></div>
  <div class="toolbar">
    <button onclick="Editor.showImport()">Import</button>
    <button onclick="Editor.showExport()">Export</button>
    <button class="green" onclick="Solve.run()">Solve</button>
    <button onclick="GenerateAndLoad()" style="background:var(--accent);color:#fff;border-color:var(--accent)">Generate</button>
    <button onclick="Editor.clear()">Clear</button>
  </div>
</header>

<div class="main">
  <div class="panel editor-panel">
    <div id="gridWrapper"></div>
    <div class="legend" id="legendArea"></div>
  </div>
  <div class="panel solver-panel">
    <div class="empty-state" id="emptyState">
      <h2>Setup your puzzle, then hit Solve</h2>
      <p>Paint regions, place cats/X marks, then click <strong>Solve</strong> to see step-by-step reasoning.</p>
      <div class="example-btns">
        <button onclick="Examples.load(5)">5x5 Example</button>
        <button onclick="Examples.load(6)">6x6 Example</button>
        <button onclick="Examples.load(7)">7x7 Example</button>
      </div>
    </div>
    <div id="solverContent" style="display:none;flex:1;display:flex;flex-direction:column">
      <div class="playback-bar">
        <button id="btnFirst" onclick="Playback.first()" title="First">&#9198;</button>
        <button id="btnPrev" onclick="Playback.prev()" title="Prev">&#9664;</button>
        <button id="btnPlay" onclick="Playback.toggle()" title="Play">&#9654;</button>
        <button id="btnNext" onclick="Playback.next()" title="Next">&#9654;</button>
        <button id="btnLast" onclick="Playback.last()" title="Last">&#9197;</button>
        <span class="step-counter" id="stepCounter">0 / 0</span>
        <label style="font-size:.75rem;color:var(--muted)">Speed</label>
        <input type="range" class="speed-slider" id="speedSlider" min="1" max="10" value="5">
      </div>
      <div class="step-list" id="stepList"></div>
    </div>
  </div>
</div>

<div class="status-bar">
  <span id="statusText">Ready</span>
  <span id="statusInfo"></span>
</div>

<div class="import-modal" id="importModal">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-bottom:12px;font-size:1rem">Import</h3>
    <textarea id="modalTextarea" spellcheck="false"></textarea>
    <div class="modal-btns">
      <button onclick="Editor.closeModal()">Cancel</button>
      <button id="modalAction" onclick="Editor.modalAction()" style="background:var(--accent);color:#fff;border-color:var(--accent)">Import</button>
    </div>
  </div>
</div>

<div class="complete-overlay" id="completeModal">
  <div class="complete-card">
    <div class="trophy">&#127942;</div>
    <h3>Puzzle Solved!</h3>
    <p id="completeMsg"></p>
    <button onclick="Playback.dismissComplete()">OK</button>
  </div>
</div>

<script src="examples.js"></script>
<script src="generator.js"></script>
<script src="solver.js"></script>
<script src="playback.js"></script>
<script src="editor.js"></script>
</body>
</html>
